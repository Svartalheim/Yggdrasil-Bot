[project]
name = "yggdrasil-bot"
version = "0.1.0"
description = "YggdrasilBot discord bot"
readme = "README.md"
requires-python = ">=3.12"
author = ["svartalheim", "lleans"]
classifiers=[
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "discord-py[voice]==2.4.0",
    "pytz>=2025.2",
    "wavelink==3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["YggBot"]

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "ruff>=0.11.0",
]

[tool.ruff]
include = ["YggBot/*", "main.py", "config.py"]
preview = true
target-version = "py312"

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true
